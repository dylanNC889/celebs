<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebrity Heads</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body data-category="">
<header id="head"><h1>Celebrity Heads</h1></header>
<main id="main"><p class="count">Loading…</p></main>
<footer class="foot" id="foot"></footer>
<div id="status" class="status" role="status" hidden></div>
<dialog class="add" id="signin-box" aria-label="Sign in to edit">
  <h2>Sign in to edit</h2>
  <form class="form" id="signin-form">
    <p class="note">Paste a GitHub token that can change dylanNC889/celebs (Contents: read and write). It stays in this browser only; sign out at the bottom of the page to remove it.</p>
    <input class="field" id="token" type="password" autocomplete="off" required placeholder="github_pat_…" aria-label="GitHub token">
    <div class="row"><button class="btn primary">Sign in</button><button type="button" class="btn" id="signin-cancel">Cancel</button></div>
  </form>
</dialog>
<script src="app.js?v=1"></script>
</body>
</html>
